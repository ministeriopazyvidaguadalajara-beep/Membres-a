<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Membresía — Iglesia Ministerio Paz y Vida</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:13px;color:#1a1a1a;background:#f5f5f0}
.app{max-width:820px;margin:20px auto;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e0e0e0}
.hdr{background:#e53935;padding:14px 18px;display:flex;align-items:center;gap:12px}
.hdr-txt h1{font-size:14px;font-weight:500;color:#fff;line-height:1.3}
.hdr-txt p{font-size:11px;color:rgba(255,255,255,0.75);margin-top:2px}
.logo-circ{width:46px;height:46px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sync-bar{background:#fff3f3;border-bottom:1px solid #ffcdd2;padding:6px 16px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#c0392b}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#e53935;display:inline-block;margin-right:5px}
.sync-dot.red{background:#e53935}.sync-dot.orange{background:#ff9800}
.nav{display:flex;border-bottom:1px solid #e0e0e0;background:#fff}
.nb{flex:1;padding:10px 4px;border:none;background:none;cursor:pointer;font-size:12px;color:#666;border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px;font-family:inherit}
.nb.on{color:#e53935;border-bottom-color:#e53935;font-weight:500}
.nb:hover:not(.on){background:#f5f5f0}
.pane{padding:16px;display:none}
.pane.on{display:block}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.sc{background:#f5f5f0;border-radius:8px;padding:12px}
.sc-lbl{font-size:11px;color:#666}
.sc-val{font-size:22px;font-weight:500;color:#e53935;margin-top:2px}
.sc-sub{font-size:11px;color:#888}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sec-ttl{font-size:14px;font-weight:500}
.btn-p{background:#e53935;color:#fff;border:none;border-radius:8px;padding:7px 13px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit}
.btn-p:hover{background:#c0392b}
.btn-s{background:none;border:1px solid #ccc;border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;color:#555;display:inline-flex;align-items:center;gap:5px;font-family:inherit}
.btn-s:hover{background:#f5f5f0}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filt input,.filt select{font-size:12px;padding:6px 9px;border-radius:8px;border:1px solid #ccc;background:#fff;color:#1a1a1a;font-family:inherit}
.filt input{width:170px}
.mcard{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:10px 13px;display:flex;align-items:center;gap:11px;cursor:pointer;margin-bottom:7px}
.mcard:hover{border-color:#aaa;background:#f9f9f9}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex-shrink:0}
.av-m{background:#fff3f3;color:#8b0000}
.av-f{background:#fbeaf0;color:#72243e}
.mi{flex:1;min-width:0}
.mi-name{font-size:13px;font-weight:500}
.mi-sub{font-size:11px;color:#666;margin-top:1px}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.bdg{font-size:10px;padding:2px 7px;border-radius:20px}
.bdg-g{background:#fff3f3;color:#8b0000}
.bdg-b{background:#e3f2fd;color:#0d47a1}
.bdg-o{background:#fff3e0;color:#e65100}
.bdg-p{background:#f3e5f5;color:#6a1b9a}
.empty{text-align:center;padding:28px 16px;color:#888}
.fov{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:16px;margin-top:8px}
.fov-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #e0e0e0}
.fov-ttl{font-size:14px;font-weight:500}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg.full{grid-column:1/-1}
.flbl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.4px;font-weight:500}
.finp{font-size:13px;padding:7px 9px;border-radius:8px;border:1px solid #ccc;background:#fff;color:#1a1a1a;width:100%;font-family:inherit}
.finp:focus{outline:none;border-color:#e53935}
.fsec{grid-column:1/-1;font-size:11px;font-weight:500;color:#e53935;margin-top:6px;padding-top:8px;border-top:1px solid #e0e0e0}
.fact{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;grid-column:1/-1}
.check-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid #ccc;border-radius:8px;cursor:pointer;background:#fff}
.check-row input[type=checkbox]{width:15px;height:15px;accent-color:#e53935;cursor:pointer;flex-shrink:0}
.check-row label{font-size:13px;cursor:pointer;color:#1a1a1a}
.ficha-wrap{background:#fff;border:1px solid #e0e0e0;border-radius:12px;margin-top:8px}
.ficha-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #e0e0e0}
.ficha-body{padding:18px}
.ficha-top{display:flex;align-items:flex-start;justify-content:space-between;padding-bottom:12px;border-bottom:2px solid #e53935;margin-bottom:14px}
.ficha-church h2{font-size:13px;font-weight:500;color:#e53935}
.ficha-church p{font-size:10px;color:#888;margin-top:1px}
.ficha-person{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ficha-pname{font-size:16px;font-weight:500}
.ficha-prole{font-size:11px;color:#666;margin-top:2px}
.fsec-ttl{font-size:10px;font-weight:500;color:#e53935;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #e53935;padding-bottom:3px;margin-bottom:7px;margin-top:12px}
.ffields{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}
.ff{display:flex;flex-direction:column;gap:1px;padding-bottom:4px;border-bottom:1px solid #f0f0f0}
.ff.full{grid-column:1/-1}
.ff-lbl{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:.4px}
.ff-val{font-size:12px;font-weight:500;min-height:16px}
.firma-row{display:flex;gap:20px;margin-top:18px}
.firma-box{flex:1;text-align:center}
.firma-line{border-bottom:1px solid #ccc;height:28px;margin-bottom:4px}
.firma-lbl{font-size:10px;color:#888}
.chart-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.crd{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:13px}
.crd-ttl{font-size:11px;color:#666;margin-bottom:10px;font-weight:500}
.bar-group{display:flex;align-items:flex-end;gap:4px;height:80px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.bar-lbl{font-size:9px;color:#888;text-align:center;line-height:1.3}
.pie-row{display:flex;align-items:center;gap:12px}
.pie-leg{display:flex;flex-direction:column;gap:5px}
.pie-li{display:flex;align-items:center;gap:6px;font-size:11px;color:#666}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.civil-grid{display:flex;flex-wrap:wrap;gap:7px}
.civil-item{background:#f5f5f0;border-radius:8px;padding:8px 12px;text-align:center;min-width:80px}
.civil-n{font-size:18px;font-weight:500;color:#e53935}
.civil-l{font-size:10px;color:#888;margin-top:1px}
.resumen-box{background:#e53935;color:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
.resumen-box h3{font-size:12px;font-weight:500;margin-bottom:10px;opacity:.85;text-transform:uppercase;letter-spacing:.5px}
.resumen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.resumen-item{background:rgba(255,255,255,.18);border-radius:8px;padding:10px;text-align:center}
.resumen-item .rn{font-size:22px;font-weight:500}
.resumen-item .rl{font-size:10px;opacity:.8;margin-top:2px}
.franjas-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.franja-item{background:rgba(255,255,255,.18);border-radius:8px;padding:8px;text-align:center}
.franja-item .fn2{font-size:18px;font-weight:500}
.franja-item .fl{font-size:10px;opacity:.8;margin-top:1px;line-height:1.3}
@media print{
  .sync-bar,.nav,.ficha-bar,.btn-p,.btn-s{display:none!important}
  .app{border:none;margin:0}
}
@media(max-width:520px){
  .sgrid{grid-template-columns:1fr 1fr}
  .fgrid{grid-template-columns:1fr}
  .fg.full,.fsec,.fact{grid-column:1}
  .ffields,.chart-col,.resumen-grid{grid-template-columns:1fr}
  .ff.full{grid-column:1}
  .franjas-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

  <div class="crd" style="margin-bottom:10px">
    <div class="crd-ttl"><i class="ti ti-heart"></i> Estado civil</div>
    <div class="civil-grid" id="civil-grid"></div>
  </div>
  <div class="crd">
    <div class="crd-ttl"><i class="ti ti-award"></i> Cargos</div>
    <div class="civil-grid" id="cargos-grid"></div>
  </div>
</div>
</div>

<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxK3UDXoFh1GgEKRvRMQ9V0quN1525uUv0w5SG_CKqPMdKFM0QnhCjdqR_6xJLuQ2liNA/exec';
const COLS = ['id','nombre','apellidos','dni','fnac','sexo','civil','tel','email','dir','fconv','fbaut_ok','fbaut','ministerio','cargo','posicion','proc','falta','notas','estado'];
const CARGOS_BASE = ['Pastor/a','Diácono/a','Anciano/a','Líder de célula','Líder de jóvenes','Líder de niños','Coordinador/a','Miembro activo'];
const FRANJAS = ['ninos','adolescentes','jovenes','adultos'];
const FRANJA_LABEL = {ninos:'Niños\n0-12', adolescentes:'Adolesc.\n13-17', jovenes:'Jóvenes\n18-29', adultos:'Adultos\n30+'};

let DB = [];
let syncing = false;
let cargosExtra = [];
try { cargosExtra = JSON.parse(localStorage.getItem('pv_cargos') || '[]'); } catch(e){}

function todosLosCargos() {
  return [...CARGOS_BASE, ...cargosExtra.filter(c => !CARGOS_BASE.includes(c))];
}

function setSyncStatus(s, msg) {
  document.getElementById('sync-txt').innerHTML = msg;
  document.getElementById('sync-dot').className = 'sync-dot ' + (s==='ok'?'':s==='error'?'red':'orange');
}

async function cargarDatos() {
  if (syncing) return;
  syncing = true;
  setSyncStatus('orange', 'Cargando datos...');
  try {
    const res = await fetch(SHEET_URL + '?t=' + Date.now());
    const data = await res.json();
    DB = Array.isArray(data) ? data.filter(r => r.id).map(r => {
      const obj = {};
      COLS.forEach(c => obj[c] = r[c] !== undefined ? String(r[c]) : '');
      obj.id = Number(obj.id);
      return obj;
    }) : [];
    setSyncStatus('ok', 'Sincronizado · ' + new Date().toLocaleTimeString('es-ES'));
    try { localStorage.setItem('pv_backup', JSON.stringify(DB)); } catch(e){}
    renderPanel();
    const a = document.querySelector('.nb.on');
    if (a && a.id==='nb-miembros') renderLista();
    if (a && a.id==='nb-stats') renderStats();
  } catch(e) {
    setSyncStatus('error', 'Sin conexión — datos locales');
    try { DB = JSON.parse(localStorage.getItem('pv_backup') || '[]'); } catch(e2){}
    renderPanel();
  }
  syncing = false;
}

async function guardarEnSheets(miembro) {
  setSyncStatus('orange', 'Guardando...');
  try {
    await fetch(SHEET_URL, {
      method: 'POST', mode: 'no-cors',
      body: JSON.stringify({action:'save', member: miembro}),
      headers: {'Content-Type':'application/json'}
    });
    try { localStorage.setItem('pv_backup', JSON.stringify(DB)); } catch(e){}
    setSyncStatus('ok', 'Guardado · ' + new Date().toLocaleTimeString('es-ES'));
  } catch(e) {
    try { localStorage.setItem('pv_backup', JSON.stringify(DB)); } catch(e2){}
    setSyncStatus('error', 'Sin conexión — guardado local');
  }
}

async function eliminarEnSheets(id) {
  try {
    await fetch(SHEET_URL, {
      method: 'POST', mode: 'no-cors',
      body: JSON.stringify({action:'delete', id: id}),
      headers: {'Content-Type':'application/json'}
    });
  } catch(e) {}
}

function age(d) {
  if(!d || d==='') return null;
  if(/^\d{1,2}[\/\-]\d{1,2}$/.test(d.trim())) return null;
  const b=new Date(d), n=new Date();
  if(isNaN(b.getTime())) return null;
  let a=n.getFullYear()-b.getFullYear();
  if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate())) a--;
  return a;
}

function franja(d) {
  const a = age(d);
  if(a === null) return null;
  if(a <= 12) return 'ninos';
  if(a <= 17) return 'adolescentes';
  if(a <= 29) return 'jovenes';
  return 'adultos';
}

function fd(d) {
  if(!d||d==='') return '—';
  const p=d.split('-');
  return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : d;
}

function ini(m) { return ((m.nombre||'')[0]+(m.apellidos||'')[0]||'').toUpperCase(); }

function esBautizado(m) {
  return m.fbaut_ok === 'true' || m.fbaut_ok === '1' || (m.fbaut && m.fbaut.trim() !== '');
}

function go(tab) {
  ['panel','miembros','stats'].forEach(t => {
    document.getElementById('pane-'+t).className='pane'+(t===tab?' on':'');
    document.getElementById('nb-'+t).className='nb'+(t===tab?' on':'');
  });
  if(tab==='panel') renderPanel();
  if(tab==='miembros') renderLista();
  if(tab==='stats') renderStats();
}

function cardHTML(m) {
  const a = age(m.fnac);
  const f = franja(m.fnac);
  const franjaLbl = f ? FRANJA_LABEL[f].replace('\n',' ') : '';
  return `<div class="mcard" onclick="abrirFicha(${m.id})">
    <div class="av ${m.sexo==='Mujer'?'av-f':'av-m'}">${ini(m)}</div>
    <div class="mi">
      <div class="mi-name">${m.nombre} ${m.apellidos}</div>
      <div class="mi-sub">${[m.sexo, a!==null?a+' años':'', franjaLbl, m.civil].filter(Boolean).join(' · ')}${m.dni?' · '+m.dni:''}</div>
      <div class="badges">
        ${esBautizado(m)?'<span class="bdg bdg-g"><i class="ti ti-droplet" style="font-size:10px"></i> Bautizado/a</span>':''}
        ${m.ministerio?'<span class="bdg bdg-b">'+m.ministerio+'</span>':''}
        ${m.cargo?'<span class="bdg bdg-o">'+m.cargo+'</span>':''}
        ${m.posicion?'<span class="bdg bdg-p">'+m.posicion+'</span>':''}
      </div>
    </div>
  </div>`;
}

function renderPanel() {
  const activos=DB.filter(x=>!x.estado||x.estado==='activo');
  const t=activos.length;
  const mv=activos.filter(x=>x.sexo==='Varón').length;
  const mf=activos.filter(x=>x.sexo==='Mujer').length;
  const b=activos.filter(esBautizado).length;
  const inact=DB.filter(x=>x.estado==='inactivo'||x.estado==='ex').length;
  document.getElementById('sgrid').innerHTML=`
    <div class="sc"><div class="sc-lbl">Miembros activos</div><div class="sc-val">${t}</div>${inact?`<div class="sc-sub">${inact} inactivo${inact>1?'s':''}</div>`:''}</div>
    <div class="sc"><div class="sc-lbl">Varones</div><div class="sc-val">${mv}</div><div class="sc-sub">${t?Math.round(mv/t*100)+'%':''}</div></div>
    <div class="sc"><div class="sc-lbl">Mujeres</div><div class="sc-val">${mf}</div><div class="sc-sub">${t?Math.round(mf/t*100)+'%':''}</div></div>
    <div class="sc"><div class="sc-lbl">Bautizados</div><div class="sc-val">${b}</div><div class="sc-sub">${t?Math.round(b/t*100)+'%':''}</div></div>`;
  const rec=[...DB].sort((a,b2)=>b2.id-a.id).slice(0,4);
  document.getElementById('recent').innerHTML = rec.length ? rec.map(m=>cardHTML(m)).join('') :
    '<div class="empty"><i class="ti ti-users" style="font-size:26px;display:block;margin-bottom:8px"></i>Sin miembros aún.<br><br><button class="btn-p" onclick="go(\'miembros\');setTimeout(abrirForm,50)"><i class="ti ti-plus"></i> Añadir primer miembro</button></div>';
}

function renderLista() {
  const q=(document.getElementById('q')||{}).value?.toLowerCase()||'';
  const fs=(document.getElementById('fs')||{}).value||'';
  const fb=(document.getElementById('fb')||{}).value||'';
  const fm=(document.getElementById('fm')||{}).value||'';
  const ff=(document.getElementById('ffranja')||{}).value||'';
  const fe=(document.getElementById('festado')||{}).value;
  const estadoFiltro = fe === undefined ? 'activo' : fe;
  let list=DB.filter(m=>{
    const est = m.estado || 'activo';
    if(estadoFiltro && est !== estadoFiltro) return false;
    if(q&&!((m.nombre+' '+m.apellidos).toLowerCase().includes(q)||(m.dni||'').toLowerCase().includes(q))) return false;
    if(fs&&m.sexo!==fs) return false;
    if(fb==='si'&&!esBautizado(m)) return false;
    if(fb==='no'&&esBautizado(m)) return false;
    if(fm&&m.ministerio!==fm) return false;
    if(ff&&franja(m.fnac)!==ff) return false;
    return true;
  }).sort((a,b)=>(a.apellidos+a.nombre).localeCompare(b.apellidos+b.nombre));
  document.getElementById('lista').innerHTML = list.length ? list.map(m=>cardHTML(m)).join('') :
    '<div class="empty">No se encontraron miembros con esos filtros.</div>';
}

function cargoSelectHTML(valorActual) {
  const cargos = todosLosCargos();
  const esCustom = valorActual && !cargos.includes(valorActual);
  return `<select class="finp" id="fcar" onchange="toggleCargoCustom(this)">
    <option value="">—</option>
    ${cargos.map(x=>`<option ${valorActual===x?'selected':''}>${x}</option>`).join('')}
    <option value="__nuevo__" ${esCustom?'selected':''}>+ Añadir cargo nuevo...</option>
  </select>
  <input class="finp" id="fcar-custom" style="margin-top:5px;display:${esCustom?'block':'none'}" placeholder="Escribe el cargo..." value="${esCustom?valorActual:''}">`;
}

function toggleCargoCustom(sel) {
  const custom = document.getElementById('fcar-custom');
  if(custom) custom.style.display = sel.value === '__nuevo__' ? 'block' : 'none';
}

function getCargoValue() {
  const sel = document.getElementById('fcar');
  if(!sel) return '';
  if(sel.value === '__nuevo__') {
    const v = (document.getElementById('fcar-custom')?.value || '').trim();
    if(v && !CARGOS_BASE.includes(v) && !cargosExtra.includes(v)) {
      cargosExtra.push(v);
      try { localStorage.setItem('pv_cargos', JSON.stringify(cargosExtra)); } catch(e){}
    }
    return v;
  }
  return sel.value;
}

        <div class="fg"><span class="flbl">Estado en la iglesia</span><select class="finp" id="festado-m"><option value="activo" ${ (!v('estado')||v('estado')==='activo')?'selected':'' }>Activo</option><option value="inactivo" ${v('estado')==='inactivo'?'selected':''}>Inactivo</option><option value="ex" ${v('estado')==='ex'?'selected':''}>Ex miembro</option></select></div>
        <div class="fg"><span class="flbl">Teléfono</span><input class="finp" id="ftel" value="${v('tel')}" placeholder="600 000 000"></div>

          <span class="flbl">Cargo</span>
          <div id="cargo-wrap">${cargoSelectHTML(v('cargo'))}</div>
        </div>
        <div class="fg"><span class="flbl">Posición / Rol específico</span><input class="finp" id="fpos" value="${v('posicion')}" placeholder="Ej: Líder de jóvenes, Tesorero..."></div>
        <div class="fg"><span class="flbl">Ministerio / Área</span><select class="finp" id="fmin"><option value="">—</option>${['Alabanza','Jóvenes','Niños','Evangelismo','Oración','Diaconado','Pastoral'].map(x=>`<option ${v('ministerio')===x?'selected':''}>${x}</option>`).join('')}</select></div>
        <div class="fg"><span class="flbl">Iglesia de procedencia</span><input class="finp" id="fproc" value="${v('proc')}" placeholder="Si viene de otra iglesia"></div>

}

function cerrarForm() { document.getElementById('form-area').innerHTML=''; }
function gv(id) { return (document.getElementById(id)?.value||'').trim(); }

async function guardar(id) {
  const nombre=gv('fn'), apellidos=gv('fa');
  if(!nombre||!apellidos){alert('Nombre y apellidos son obligatorios.');return;}
  if(!id){
    const dup=DB.find(x=>x.nombre.trim().toLowerCase()===nombre.toLowerCase()&&(x.apellidos||'').trim().toLowerCase()===apellidos.toLowerCase());
    if(dup&&!confirm(`⚠️ Ya existe un miembro con el nombre "${dup.nombre} ${dup.apellidos||''}".\n¿Deseas crear otro de todas formas?`))return;
  }
  const bautOk = document.getElementById('fbaut-ok')?.checked ? 'true' : '';
  const cargo = getCargoValue();
  const estado = document.getElementById('festado-m')?.value || 'activo';
  const d={nombre,apellidos,dni:gv('fdni'),fnac:gv('ffn'),sexo:gv('fsx'),civil:gv('fec'),tel:gv('ftel'),email:gv('femail'),dir:gv('fdir'),fconv:gv('fconv'),fbaut_ok:bautOk,fbaut:gv('fbaut'),ministerio:gv('fmin'),cargo,posicion:gv('fpos'),proc:gv('fproc'),falta:gv('falta'),notas:gv('fnot'),estado};
  if(id){const i=DB.findIndex(x=>x.id===id);DB[i]={...DB[i],...d};}
  else{d.id=Date.now();DB.push(d);}
  cerrarForm(); renderLista(); renderPanel();
  const miembro = id ? DB.find(x=>x.id===id) : DB[DB.length-1];
  await guardarEnSheets(miembro);
}

            </div>

function drawPie(cid,data,lid) {
  const c=document.getElementById(cid); if(!c) return;
  const ctx=c.getContext('2d');
  const tot=data.reduce((s,d)=>s+d.v,0);
  if(!tot){document.getElementById(lid).innerHTML='<span style="font-size:11px;color:#888">Sin datos</span>';return;}
  let ang=-Math.PI/2;
  ctx.clearRect(0,0,72,72);
  data.forEach(d=>{
    const sl=(d.v/tot)*2*Math.PI;
    ctx.beginPath();ctx.moveTo(36,36);ctx.arc(36,36,34,ang,ang+sl);ctx.closePath();
    ctx.fillStyle=d.c;ctx.fill();ang+=sl;
  });
  document.getElementById(lid).innerHTML=data.map(d=>`<div class="pie-li"><div class="dot" style="background:${d.c}"></div>${d.l}: <strong>${d.v}</strong> (${Math.round(d.v/tot*100)}%)</div>`).join('');
}

function renderStats() {
  const t=DB.length;
  const mv=DB.filter(x=>x.sexo==='Varón').length;
  const mf=DB.filter(x=>x.sexo==='Mujer').length;
  const b=DB.filter(esBautizado).length;
  const franjaCount = {};
  FRANJAS.forEach(f => franjaCount[f] = DB.filter(x=>franja(x.fnac)===f).length);

  // Resumen
  document.getElementById('resumen-box').innerHTML=`
    <h3>Resumen de membresía</h3>
    <div class="resumen-grid">
      <div class="resumen-item"><div class="rn">${t}</div><div class="rl">Total miembros</div></div>
      <div class="resumen-item"><div class="rn">${mv}</div><div class="rl">Varones${t?' ('+Math.round(mv/t*100)+'%)':''}</div></div>
      <div class="resumen-item"><div class="rn">${mf}</div><div class="rl">Mujeres${t?' ('+Math.round(mf/t*100)+'%)':''}</div></div>
    </div>
    <div class="franjas-grid">
      <div class="franja-item"><div class="fn2">${franjaCount.ninos}</div><div class="fl">Niños<br>0-12</div></div>
      <div class="franja-item"><div class="fn2">${franjaCount.adolescentes}</div><div class="fl">Adolescentes<br>13-17</div></div>
      <div class="franja-item"><div class="fn2">${franjaCount.jovenes}</div><div class="fl">Jóvenes<br>18-29</div></div>
      <div class="franja-item"><div class="fn2">${franjaCount.adultos}</div><div class="fl">Adultos<br>30+</div></div>
    </div>`;

  drawPie('pie1',[{l:'Varones',v:mv,c:'#e53935'},{l:'Mujeres',v:mf,c:'#993556'},{l:'Sin datos',v:t-mv-mf,c:'#ccc'}].filter(x=>x.v>0),'leg1');
  drawPie('pie2',[{l:'Bautizados',v:b,c:'#e53935'},{l:'Sin bautismo',v:t-b,c:'#ccc'}].filter(x=>x.v>0),'leg2');

  const mData=FRANJAS.map(f=>DB.filter(x=>x.sexo==='Varón'&&franja(x.fnac)===f).length);
  const fData=FRANJAS.map(f=>DB.filter(x=>x.sexo==='Mujer'&&franja(x.fnac)===f).length);
  const mx=Math.max(...mData,...fData,1);
  const barLabels=['Niños\n0-12','Adolesc.\n13-17','Jóvenes\n18-29','Adultos\n30+'];
  document.getElementById('age-bars').innerHTML=FRANJAS.map((fr,i)=>`
    <div class="bar-col">
      <div style="font-size:9px;color:#888">${mData[i]+fData[i]||''}</div>
      <div style="display:flex;gap:2px;align-items:flex-end;width:100%;height:64px">
        <div style="flex:1;background:#e53935;border-radius:3px 3px 0 0;height:${Math.max(2,Math.round(mData[i]/mx*64))}px"></div>
        <div style="flex:1;background:#993556;border-radius:3px 3px 0 0;height:${Math.max(2,Math.round(fData[i]/mx*64))}px"></div>
      </div>
      <div class="bar-lbl">${barLabels[i].replace('\n','<br>')}</div>
    </div>`).join('');

  const cc={};DB.forEach(m=>{if(m.civil)cc[m.civil]=(cc[m.civil]||0)+1;});
  document.getElementById('civil-grid').innerHTML=Object.entries(cc).map(([k,v])=>`<div class="civil-item"><div class="civil-n">${v}</div><div class="civil-l">${k}</div></div>`).join('')||'<span style="font-size:12px;color:#888">Sin datos</span>';

  const cg={};DB.forEach(m=>{if(m.cargo)cg[m.cargo]=(cg[m.cargo]||0)+1;});
  document.getElementById('cargos-grid').innerHTML=Object.entries(cg).map(([k,v])=>`<div class="civil-item"><div class="civil-n">${v}</div><div class="civil-l">${k}</div></div>`).join('')||'<span style="font-size:12px;color:#888">Sin datos</span>';
}

cargarDatos();

// ── Google Calendar – Cumpleaños ──────────────────────────────────────────
const GCAL_CLIENT_ID = '763863171018-n4pr8er8bgm35ec9sr2gedf5cbseu1jv.apps.googleusercontent.com';
const GCAL_SCOPE = 'https://www.googleapis.com/auth/calendar.events';
let gcalToken = null;

function gcalSignIn() {
  const client = google.accounts.oauth2.initTokenClient({
    client_id: GCAL_CLIENT_ID,
    scope: GCAL_SCOPE,
    callback: (resp) => {
      if (resp.error) { alert('Error al autenticar con Google: ' + resp.error); return; }
      gcalToken = resp.access_token;
      sincronizarCumpleanos();
    }
  });
  client.requestAccessToken();
}

async function sincronizarCumpleanos() {
  const btn = document.getElementById('btn-gcal');
  if (btn) btn.disabled = true;
  const miembros = DB.filter(m => m.fnac && m.fnac.trim() !== '');
  let ok = 0, err = 0;
  for (const m of miembros) {
    try {
      const parts = m.fnac.trim().split(/[-\/]/);
      if (parts.length < 2) continue;
      // Accept DD/MM, DD/MM/YYYY and YYYY-MM-DD
      let d, mo, y;
      if (parts[0].length === 4) { [y, mo, d] = parts; }
      else { [d, mo, y] = parts; }
      const year = parseInt(y) || 2000;
      const month = parseInt(mo), day = parseInt(d);
      if (!month || !day) continue;
      const nombre = `🎂 Cumpleaños de ${m.nombre} ${m.apellidos||''}`.trim();
      const evento = {
        summary: nombre,
        recurrence: ['RRULE:FREQ=YEARLY'],
        start: { date: `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}` },
        end:   { date: `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}` },
        reminders: { useDefault: false, overrides: [{ method: 'popup', minutes: 480 }] }
      };
      const resp = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + gcalToken, 'Content-Type': 'application/json' },
        body: JSON.stringify(evento)
      });
      if (resp.ok) ok++; else err++;
    } catch(e) { err++; }
  }
  if (btn) btn.disabled = false;
  const msg = `✅ Sincronización completada:\n• ${ok} cumpleaños añadidos al calendario\n${err ? '• ' + err + ' errores' : ''}`;
  alert(msg);
}
